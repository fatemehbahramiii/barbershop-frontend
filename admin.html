<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171715"><title>مدیریت آرایشگاه</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body class="admin-body"><main class="admin-shell"><a class="back-link" href="index.html">← بازگشت به سایت</a><section id="login-panel" class="login-card"><span class="brand-mark">B</span><div class="section-kicker">BARBER / MANAGEMENT</div><h1>ورود به پنل <em>مدیریریت</em></h1><p>برای مدیریت نوبت‌ها، تعرفه‌ها و نمونه‌کارها وارد شوید.</p><form id="login-form"><label>نام کاربری<input name="username" required autocomplete="username"></label><label>رمز عبور<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-gold" type="submit">ورود به پنل</button><p id="login-message" class="form-message"></p></form></section>
<section id="dashboard" class="dashboard hidden"><header class="dash-header"><div><div class="section-kicker">BARBER / DASHBOARD</div><h1>پنل <em>مدیریت</em></h1></div><button id="logout-button" class="button button-outline">خروج</button></header><div class="dash-tabs"><button class="tab active" data-tab="appointments">نوبت‌ها</button><button class="tab" data-tab="services">خدمات و قیمت‌ها</button><button class="tab" data-tab="posts">پست‌ها و گالری</button></div>
<section id="tab-appointments" class="tab-panel"><div class="panel-heading"><h2>درخواست‌های نوبت</h2><button class="button button-outline refresh-button" data-refresh="appointments">بروزرسانی</button></div><div id="appointments-list" class="admin-list">در حال بارگذاری...</div></section>
<section id="tab-services" class="tab-panel hidden"><div class="panel-heading"><h2>مدیریت خدمات و قیمت‌ها</h2></div><form id="service-form" class="inline-form"><input name="name" placeholder="نام خدمت" required><input name="price" type="number" min="0" placeholder="قیمت (تومان)" required><input name="duration_minutes" type="number" min="5" value="30" placeholder="مدت (دقیقه)" required><input name="description" placeholder="توضیح کوتاه"><button class="button button-gold">افزودن خدمت</button></form><div id="admin-services" class="admin-list"></div></section>
<section id="tab-posts" class="tab-panel hidden"><div class="panel-heading"><h2>مدیریت پست‌ها و نمونه‌کارها</h2></div><form id="post-form" class="post-form"><label>عنوان<input name="title" required maxlength="120"></label><label>توضیحات<textarea name="description" rows="2" maxlength="500"></textarea></label><label>تصویر<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><button class="button button-gold">آپلود و انتشار</button><p class="form-message" id="post-message"></p></form><div id="admin-posts" class="admin-list"></div></section></section></main><script src="assets/js/config.js"></script><script src="assets/js/admin.js"></script></body></html>
